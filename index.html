<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JesWay Hospital Navigator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; padding: 10px; }
    .container { width: 100%; max-width: 480px; background: #0f172a; padding: 15px; border-radius: 12px; }
    .header { background: #0ea5e9; padding: 10px; text-align: center; font-size: 1.2rem; font-weight: bold; border-radius: 8px; margin-bottom: 8px; }
    .status { background: #1e293b; padding: 8px; text-align: center; font-size: 0.95rem; font-weight: bold; border-radius: 6px; color: #38bdf8; margin-bottom: 12px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .btn { background: #1e293b; color: white; border: 1px solid #334155; padding: 10px 4px; font-size: 0.75rem; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; word-wrap: break-word; }
    .btn.start { background: #0ea5e9; color: white; }
    .btn.dest { background: #10b981; color: white; }
    .actions { display: none; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .action-btn { flex: 1; padding: 8px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; }
    .reset-btn { background: #ef4444; }
    .audio-btn { background: #0ea5e9; }
    .directions { background: #1e293b; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; margin-bottom: 12px; text-align: center; min-height: 50px; }
    .image-container { width: 100%; height: 200px; border: 2px solid #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #1e293b; overflow: hidden; }
    .image-container img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">JesWay Hospital Navigator</div>
  <div class="status" id="status">Please tap on your Location & Destination</div>

  <div class="grid" id="buttonGrid"></div>

  <div class="actions" id="actionButtons">
    <button class="action-btn reset-btn" onclick="resetSelection()">🔄 Reset Selection</button>
    <button class="action-btn audio-btn" onclick="playAudio()">🔊 Read Aloud</button>
  </div>

  <div class="directions" id="directionsText"></div>

  <div class="image-container" id="imageBox">
    <span style="color: #94a3b8; font-size: 0.85rem;">Select start & destination to view landmark</span>
  </div>
</div>

<script>
  const LOCATIONS = [
    "Main OPD", "Maternity", "Accident", "Main Gate",
    "Administration", "Emergency", "Family Health", "Cardio",
    "X-Ray", "Mortuary", "Laboratory", "Blood Bank",
    "Main Pharmacy", "ENT", "Eye Clinic", "Pharmacy Annex",
    "MRI", "Physiotherapy"
  ];

  const routes = {
    "Main Gate|Maternity": { text: "Walk straight past the gate. Look to your right and walk towards the building.", img: "maternity.png" },
    "Main Gate|Administration": { text: "Go up from the main gate, take the first path to your right and walk straight to the red and white building.", img: "administration.png" },
    "Main OPD|Laboratory": { text: "Walk into the yard, on your left, look for the first pathway with the parking lot on the right and walk towards the building.", img: "laboratory.png" },
    "Main Gate|Main OPD": { text: "After entering the yard, walk straight and watch out for signs with Main OPD on.", img: "Main OPD.png" },
    "Main OPD|X-Ray": { text: "Head down the west corridor from Main OPD. X-Ray department is opposite Room 4.", img: "accidentXray.png" },
    "Main OPD|Main Pharmacy": { text: "Enter through Main OPD, walk down the paved driveway. Main Pharmacy block is on your left.", img: "pharmlab.png" },
    "Main OPD|Eye Clinic": { text: "Head down the west corridor from Main OPD. Eye Clinic is right past the hallway.", img: "eyeclinic.png" },
    "Main OPD|Physiotherapy": { text: "Walk into the yard, on your left, look for the first pathway with the parking lot on the right and walk towards the building.", img: "physioeyeear.png" }
  };

  let selectedStart = null;
  let selectedDest = null;
  let currentDirection = "";

  const gridEl = document.getElementById('buttonGrid');
  const statusEl = document.getElementById('status');
  const actionsEl = document.getElementById('actionButtons');
  const directionsEl = document.getElementById('directionsText');
  const imageBoxEl = document.getElementById('imageBox');

  function renderGrid() {
    gridEl.innerHTML = '';
    LOCATIONS.forEach(loc => {
      const btn = document.createElement('button');
      btn.className = 'btn';
      if (loc === selectedStart) btn.classList.add('start');
      if (loc === selectedDest) btn.classList.add('dest');
      btn.innerText = loc;
      btn.onclick = () => selectLocation(loc);
      gridEl.appendChild(btn);
    });
  }

  function selectLocation(loc) {
    if (!selectedStart) {
      selectedStart = loc;
      statusEl.innerText = `Location set: ${selectedStart}\nNow tap your DESTINATION`;
      renderGrid();
    } else if (!selectedDest && loc !== selectedStart) {
      selectedDest = loc;
      statusEl.innerText = `Route: ${selectedStart} ➔ ${selectedDest}`;
      renderGrid();

      const key = `${selectedStart}|${selectedDest}`;
      const routeData = routes[key] || {
        text: `From ${selectedStart}, follow the directional wall signs following the primary corridor toward ${selectedDest}.`,
        img: `${selectedDest.toLowerCase().replace(/ /g, '_')}.png`
      };

      currentDirection = routeData.text;
      directionsEl.innerText = currentDirection;
      actionsEl.style.display = 'flex';

      imageBoxEl.innerHTML = `<img src="${routeData.img}" onerror="this.onerror=null; this.parentElement.innerHTML='<span style=\\'color:#f87171\\'>[ Landmark Photo ${routeData.img} ]</span>';">`;

      speakDirections(`Route set from ${selectedStart} to ${selectedDest}. ${currentDirection}`);
    }
  }

  function speakDirections(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }
  }

  function playAudio() {
    if (currentDirection) speakDirections(currentDirection);
  }

  function resetSelection() {
    selectedStart = null;
    selectedDest = null;
    currentDirection = "";
    statusEl.innerText = "Please tap on your Location & Destination";
    directionsEl.innerText = "";
    actionsEl.style.display = 'none';
    imageBoxEl.innerHTML = '<span style="color: #94a3b8; font-size: 0.85rem;">Select start & destination to view landmark</span>';
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    renderGrid();
  }

  renderGrid();
</script>
</body>
</html>
